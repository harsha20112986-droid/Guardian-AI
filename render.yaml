services:
  - type: web
    name: guardian-ai-backend
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: GUARDIAN_SECRET_KEY
        sync: false

      - key: GMAIL_ADDRESS
        sync: false

      - key: GMAIL_APP_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false